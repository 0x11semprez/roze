name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
    - uses: actions/checkout@v4

    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build g++-14 ffmpeg python3 \
          libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
          libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
          libxrandr-dev libxrender-dev libgl1-mesa-dev

    - name: generate fixtures
      run: tests/fixtures/generate.sh

    - name: configure
      run: cmake -S . -B build -G Ninja

    - name: build tests
      run: cmake --build build --target rozeTests

    - name: run tests
      run: ctest --test-dir build --output-on-failure
